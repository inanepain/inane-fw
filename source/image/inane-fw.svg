<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6b21a8"/>
            <stop offset="100%" stop-color="#3b0764"/>
        </linearGradient>
        <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#e9d5ff"/>
            <stop offset="100%" stop-color="#a855f7"/>
        </radialGradient>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <!-- App icon background -->
    <rect x="64" y="64" rx="180" ry="180" width="896" height="896" fill="url(#bgGradient)"/>
    <!-- Skull -->
    <g id="Skull" transform="matrix(2 0 0 2 00 0)">
        <circle cx="262" cy="189" r="140" fill="#f5f3ff"/>
        <rect x="162" y="260" width="200" height="160" rx="80" fill="#f5f3ff"/>
        <!-- Eyes -->
        <g id="Eyes">
            <circle cx="210" cy="180" r="36" fill="#2e1065"/>
            <circle cx="314" cy="180" r="36" fill="#2e1065"/>
            <circle cx="211" cy="180" r="16" fill="url(#eyeGlow)" filter="url(#softGlow)"/>
            <circle cx="314" cy="180" r="16" fill="url(#eyeGlow)" filter="url(#softGlow)"/>
        </g>
        <!-- Nose -->
        <path id="Nose" d="M 262 220 C 248 242 248 260 262 268 C 276 260 276 242 262 220 Z" fill="#2e1065"/>
        <!-- Mouth -->
        <rect id="Mouth" x="210" y="260" width="104" height="36" rx="18" fill="#2e1065"/>
        <!-- Ribcage -->
        <g id="Ribcage" stroke="#e9d5ff" stroke-width="12" stroke-linecap="round">
            <line x1="190" y1="350" x2="334" y2="350"/>
            <line x1="182" y1="390" x2="342" y2="390"/>
            <line x1="198" y1="430" x2="326" y2="430"/>
        </g>
        <!-- Code symbol -->
        <g id="CodeSymbol" stroke="#c084fc" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"
           filter="url(#softGlow)">
            <polyline points="220,390 190,420 220,450"/>
            <polyline points="304,390 334,420 304,450"/>
        </g>
        <!-- Arms -->
        <g id="Arms" stroke="#e9d5ff" stroke-width="18" stroke-linecap="round">
            <line x1="170" y1="370" x2="110" y2="450"/>
            <line x1="354" y1="370" x2="414" y2="450"/>
        </g>
    </g>
</svg>
